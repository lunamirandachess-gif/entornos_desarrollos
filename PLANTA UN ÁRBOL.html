<!DOCTYPE html>
<html lang="es" data-mode="login">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLANTA UN ÁRBOL</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
/* Inicio de sesión: fondos verdes claros, detalles morados */
:root[data-mode="login"]{--bg:#e3f4dc;--card:#f4fbf0;--field:#ffffff;--base:#b9e0a9;--accent:#7b3fb0;--accent-soft:#e9dcf6;--text:#26402a;--on-accent:#ffffff;--leaf:#4e9a4a}
/* Crear usuario: colores invertidos */
:root[data-mode="signup"]{--bg:#eadcf7;--card:#f6effc;--field:#ffffff;--base:#cfb3ea;--accent:#3f9a4a;--accent-soft:#d9f0d2;--text:#3a2552;--on-accent:#ffffff;--leaf:#7b3fb0}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"])[data-mode="login"]{--bg:#1d2f1f;--card:#263d29;--field:#1a2a1c;--base:#3f6b3d;--accent:#c39be6;--accent-soft:#3a2a4d;--text:#e6f4e1;--on-accent:#24103a;--leaf:#8fd08a}
:root:not([data-theme="light"])[data-mode="signup"]{--bg:#2a1d3a;--card:#38264d;--field:#241733;--base:#6a4b8f;--accent:#8fd08a;--accent-soft:#25402a;--text:#f0e6fa;--on-accent:#12300f;--leaf:#c39be6}}
:root[data-theme="dark"][data-mode="login"]{--bg:#1d2f1f;--card:#263d29;--field:#1a2a1c;--base:#3f6b3d;--accent:#c39be6;--accent-soft:#3a2a4d;--text:#e6f4e1;--on-accent:#24103a;--leaf:#8fd08a}
:root[data-theme="dark"][data-mode="signup"]{--bg:#2a1d3a;--card:#38264d;--field:#241733;--base:#6a4b8f;--accent:#8fd08a;--accent-soft:#25402a;--text:#f0e6fa;--on-accent:#12300f;--leaf:#c39be6}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Trebuchet MS",Verdana,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;transition:background .4s,color .4s}
header{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:8px 0 22px}
h1{margin:0;font-size:clamp(2.2rem,8vw,4rem);letter-spacing:.04em;color:var(--accent);text-shadow:2px 2px 0 var(--base);text-align:center;transition:color .4s}
.tree{width:clamp(64px,14vw,96px);height:auto;flex:none}
.tree .crown{fill:var(--leaf);transition:fill .4s}.tree .crown2{fill:var(--accent);transition:fill .4s}.tree .trunk{fill:#8a5a3a}
header,main{position:relative;z-index:1}
.tree{transform-origin:50% 96%;animation:sway 7s ease-in-out infinite}
.tree .crown,.tree .crown2{transform-box:fill-box;transform-origin:50% 100%;animation:rustle 5s ease-in-out infinite}
.tree .crown2{animation-delay:-2s}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes rustle{0%,100%{transform:rotate(-1.5deg) scale(1)}50%{transform:rotate(2deg) scale(1.03)}}
.leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.leaf{position:absolute;width:14px;height:14px;border-radius:0 100% 0 100%;background:var(--leaf);opacity:0;animation:fly var(--dur) ease-in-out forwards;transition:background .4s}
.leaf.alt{background:var(--accent)}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:0}12%{opacity:.9}35%{transform:translate(calc(var(--dx)*.35),calc(var(--dy)*-.15)) rotate(calc(var(--rot)*.35))}70%{transform:translate(calc(var(--dx)*.7),calc(var(--dy)*.5)) rotate(calc(var(--rot)*.7));opacity:.8}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
/* Pantalla de inicio */
.home{--gh:20vh;position:fixed;inset:0;z-index:10;overflow:hidden;background:linear-gradient(var(--bg) 40%,var(--card));transition:opacity .9s,visibility 0s .9s}
.home.out{opacity:0;visibility:hidden}
.sc{position:absolute;inset:0}
.t{position:absolute;aspect-ratio:100/120;bottom:calc(var(--gh) - 12px);transform-origin:50% 96%;animation:sway 7s ease-in-out var(--d,0s) infinite}
.t>svg.tr{display:block;width:100%;height:100%}
.ground{position:absolute;left:-6%;right:-6%;bottom:0;height:var(--gh);background:color-mix(in srgb,var(--leaf) 45%,var(--base));border-radius:50% 50% 0 0/36px;z-index:1;box-shadow:inset 0 6px 0 color-mix(in srgb,var(--leaf) 70%,var(--base))}
#rabs{position:absolute;inset:0;z-index:2;pointer-events:none}
.hl{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.hc{position:absolute;inset:0 0 auto 0;z-index:4;padding:clamp(40px,12vh,110px) 20px 0;text-align:center}
.hc h1{font-size:clamp(2.6rem,10vw,6.5rem);margin:0 auto;max-width:12em;line-height:1.05}
.hc p{font-size:clamp(1rem,2.6vw,1.4rem);max-width:30em;margin:22px auto 28px;line-height:1.5}
.hc .primary{flex:none;padding:14px 38px;font-size:1.1rem}
.rb{position:absolute;width:clamp(38px,6vw,64px)}
.hole{position:absolute;left:-10%;bottom:-6px;width:120%;height:14px;background:#3a2a22;border-radius:50%;opacity:.75}
.burrow{position:relative;overflow:hidden;aspect-ratio:60/70}
.rab{display:block;width:100%;transform:translateY(105%);animation:peek 12s ease-in-out var(--dl) infinite}
.rab *{stroke:#d3c6ba;stroke-width:1}
@keyframes peek{0%,6%{transform:translateY(105%)}18%{transform:translateY(0)}28%{transform:translateY(-4%)}36%{transform:translateY(0)}46%{transform:translateY(-3%)}54%{transform:translateY(0)}66%,100%{transform:translateY(105%)}}
.bird{position:absolute;width:clamp(24px,3.4vw,40px);fill:var(--accent);opacity:0;animation:perch 28s ease-in-out var(--dl) infinite}
.bird .wing{fill:var(--on-accent);opacity:.4;transform-box:fill-box;transform-origin:50% 100%;animation:wing 28s ease-in-out var(--dl) infinite}
@keyframes perch{0%{transform:translate(-75vw,-35vh);opacity:0}5%{opacity:1}20%,50%{transform:translate(0,0);opacity:1}68%{transform:translate(75vw,-40vh);opacity:1}72%,100%{transform:translate(75vw,-40vh);opacity:0}}
@keyframes wing{0%,6%,12%,18%{transform:scaleY(1.6)}3%,9%,15%{transform:scaleY(-.6)}21%,49%{transform:scaleY(1)}52%,58%,64%{transform:scaleY(1.6)}55%,61%,67%{transform:scaleY(-.6)}70%,100%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.tree,.tree .crown,.tree .crown2,.t{animation:none}.leaves,.hl{display:none}.bird{animation:none;opacity:1}.bird .wing{animation:none}.rab{animation:none;transform:none}}
main{width:100%;max-width:460px}
.card{background:var(--card);border:3px solid var(--base);border-top:8px solid var(--accent);border-radius:20px;padding:26px 24px;box-shadow:0 8px 24px rgba(0,0,0,.12);transition:background .4s,border-color .4s}
h2{margin:0 0 18px;font-size:1.35rem;letter-spacing:.08em;color:var(--accent);text-align:center}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:.95rem}
.opt{font-weight:400;opacity:.7;font-size:.85rem}
.req{color:var(--accent);margin-left:2px}
input{width:100%;padding:11px 12px;font:inherit;color:var(--text);background:var(--field);border:2px solid var(--base);border-radius:10px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;padding:12px 18px;border:2px solid var(--accent);transition:transform .1s,background .2s}
button:active{transform:scale(.97)}
.primary{background:var(--accent);color:var(--on-accent);flex:1}
.secondary{background:transparent;color:var(--accent);flex:1}
.secondary:hover{background:var(--accent-soft)}
.full{width:100%;margin-top:22px}
.link{background:none;border:none;color:var(--accent);text-decoration:underline;margin:14px auto 0;display:block;padding:4px;font-weight:400}
.msg{margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:.92rem;display:none}
.msg.show{display:block}
.note{font-size:.8rem;opacity:.75;margin-top:14px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="leaves" id="leaves" aria-hidden="true"></div>
<svg width='0' height='0' style='position:absolute' aria-hidden='true'><symbol id='tr' viewBox='0 0 100 120'><rect x='43' y='68' width='14' height='46' rx='3' style='fill:#8a5a3a'/><circle cx='50' cy='38' r='30' style='fill:var(--leaf)'/><circle cx='34' cy='50' r='18' style='fill:var(--accent)' opacity='.85'/><circle cx='66' cy='48' r='16' style='fill:var(--accent)' opacity='.7'/><circle cx='50' cy='22' r='14' style='fill:var(--leaf)'/></symbol></svg>
<section class='home' id='home'>
  <div class='sc' id='scene'></div>
  <div class='ground'></div>
  <div id='rabs'></div>
  <div class='hl' id='hl' aria-hidden='true'></div>
  <div class='hc'>
    <h1>PLANTA UN ÁRBOL</h1>
    <p>Colabora con nosotros para plantar más árboles y devolver la vida a su fauna: cada árbol es un hogar.</p>
    <button type='button' class='primary' id='start'>Comenzar</button>
  </div>
</section>
<header>
  <h1>PLANTA UN ÁRBOL</h1>
  <svg class="tree" viewBox="0 0 100 120" role="img" aria-label="Árbol">
    <rect class="trunk" x="43" y="68" width="14" height="46" rx="3"/>
    <circle class="crown" cx="50" cy="38" r="30"/>
    <circle class="crown2" cx="34" cy="50" r="18" opacity=".85"/>
    <circle class="crown2" cx="66" cy="48" r="16" opacity=".7"/>
    <circle class="crown" cx="50" cy="22" r="14"/>
  </svg>
</header>

<main>
  <section id="loginView" class="card">
    <h2>INICIO DE SESIÓN</h2>
    <form id="loginForm" novalidate>
      <label for="lEmail">Correo electrónico<span class="req">*</span></label>
      <input id="lEmail" type="email" autocomplete="email" required>
      <label for="lPass">Contraseña<span class="req">*</span></label>
      <input id="lPass" type="password" autocomplete="current-password" required>
      <div class="row">
        <button type="submit" class="primary">Entrar</button>
        <button type="button" class="secondary" id="toSignup">Crear usuario</button>
      </div>
      <div class="msg" id="lMsg" role="status"></div>
    </form>
  </section>

  <section id="signupView" class="card" hidden>
    <h2>CREAR USUARIO</h2>
    <form id="signupForm" novalidate>
      <label for="sName">Nombre<span class="req">*</span></label>
      <input id="sName" type="text" autocomplete="given-name" required>
      <label for="sSurname">Apellidos<span class="req">*</span></label>
      <input id="sSurname" type="text" autocomplete="family-name" required>
      <label for="sAlias">Alias <span class="opt">(opcional)</span></label>
      <input id="sAlias" type="text" autocomplete="nickname">
      <label for="sBirth">Fecha de nacimiento<span class="req">*</span></label>
      <input id="sBirth" type="date" autocomplete="bday" required>
      <label for="sEmail">Correo electrónico<span class="req">*</span></label>
      <input id="sEmail" type="email" autocomplete="email" required>
      <label for="sPass">Contraseña<span class="req">*</span></label>
      <input id="sPass" type="password" autocomplete="new-password" minlength="6" required>
      <label for="sPass2">Repetir contraseña<span class="req">*</span></label>
      <input id="sPass2" type="password" autocomplete="new-password" required>
      <button type="submit" class="primary full">Crear nuevo usuario</button>
      <div class="msg" id="sMsg" role="status"></div>
      <button type="button" class="link" id="toLogin">← Volver al inicio de sesión</button>
    </form>
  </section>
  <p class="note">Los campos marcados con * son obligatorios.</p>
</main>

<script>
const root=document.documentElement,$=id=>document.getElementById(id);
function show(mode){
  root.dataset.mode=mode;
  $("loginView").hidden=mode!=="login";
  $("signupView").hidden=mode!=="signup";
  window.scrollTo(0,0);
}
function msg(el,text){el.textContent=text;el.classList.add("show")}
$("toSignup").onclick=()=>show("signup");
$("toLogin").onclick=()=>show("login");
$("sBirth").max=new Date().toISOString().slice(0,10);

// Hojas que se lleva el viento (ritmo suave)
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const box=$("leaves"),tree=document.querySelector(".tree");
  function spawn(){
    if(document.hidden)return;
    const r=tree.getBoundingClientRect(),l=document.createElement("span");
    const s=10+Math.random()*10;
    l.className="leaf"+(Math.random()<.35?" alt":"");
    l.style.width=l.style.height=s+"px";
    l.style.left=(r.left+r.width*(.2+Math.random()*.6))+"px";
    l.style.top=(r.top+r.height*(.1+Math.random()*.4))+"px";
    l.style.setProperty("--dx",(180+Math.random()*Math.max(300,innerWidth*.6))+"px");
    l.style.setProperty("--dy",(120+Math.random()*Math.max(250,innerHeight*.5))+"px");
    l.style.setProperty("--rot",(240+Math.random()*420)+"deg");
    l.style.setProperty("--dur",(9+Math.random()*6)+"s");
    l.addEventListener("animationend",()=>l.remove());
    box.appendChild(l);
  }
  spawn();
  setInterval(spawn,1800);
})();

// Pantalla de inicio: árboles, pájaros, conejos y hojas
(function(){
  const home=$('home');
  const trees=[
    {s:'left:-3%;width:clamp(140px,26vw,320px)',d:'0s',b:[{l:'44%',u:'90%',dl:'2s'}]},
    {s:'left:20%;width:clamp(72px,12vw,150px)',d:'-2s',b:[]},
    {s:'right:-3%;width:clamp(140px,26vw,320px)',d:'-3s',b:[{l:'26%',u:'85%',dl:'12s'}]},
    {s:'right:21%;width:clamp(72px,12vw,150px)',d:'-4.5s',b:[{l:'56%',u:'90%',dl:'20s'}]}
  ];
  const bird=b=>`<svg class='bird' viewBox='0 0 40 30' style='left:${b.l};bottom:${b.u};--dl:${b.dl}'><path d='M10 17L0 11L2 22Z'/><ellipse cx='20' cy='18' rx='11' ry='7'/><circle cx='30' cy='13' r='5'/><path d='M34 12L40 14L34 16Z' style='fill:#e8a33d'/><circle cx='31' cy='12' r='1.3' style='fill:#fff'/><ellipse class='wing' cx='19' cy='14' rx='8' ry='4'/></svg>`;
  $('scene').innerHTML=trees.map(t=>`<div class='t' style='${t.s};--d:${t.d}'><svg class='tr' viewBox='0 0 100 120'><use href='#tr' width='100' height='120'/></svg>${t.b.map(bird).join('')}</div>`).join('');

  const rabbit=`<svg class='rab' viewBox='0 0 60 70'><ellipse cx='24' cy='15' rx='5' ry='14' fill='#f6efe8'/><ellipse cx='24' cy='16' rx='2.2' ry='9' fill='#f0b8c4'/><ellipse cx='38' cy='13' rx='5' ry='14' fill='#f6efe8'/><ellipse cx='38' cy='14' rx='2.2' ry='9' fill='#f0b8c4'/><ellipse cx='31' cy='62' rx='21' ry='14' fill='#f6efe8'/><circle cx='31' cy='40' r='16' fill='#f6efe8'/><circle cx='25' cy='37' r='2' fill='#3a2a35'/><circle cx='37' cy='37' r='2' fill='#3a2a35'/><ellipse cx='31' cy='43' rx='3' ry='2' fill='#e88aa0'/></svg>`;
  const rabs=[{l:'30%',u:'.35',dl:'1s'},{l:'56%',u:'.16',dl:'5s'},{l:'82%',u:'.4',dl:'8.5s'}];
  $('rabs').innerHTML=rabs.map(r=>`<div class='rb' style='left:${r.l};bottom:calc(var(--gh)*${r.u});--dl:${r.dl}'><i class='hole'></i><div class='burrow'>${rabbit}</div></div>`).join('');

  const hl=$('hl'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function drop(){
    if(document.hidden)return;
    const ts=home.querySelectorAll('.t'),r=ts[Math.floor(Math.random()*ts.length)].getBoundingClientRect();
    const l=document.createElement('span'),s=9+Math.random()*9;
    l.className='leaf'+(Math.random()<.35?' alt':'');
    l.style.cssText=`width:${s}px;height:${s}px;left:${r.left+r.width*(.2+Math.random()*.6)}px;top:${r.top+r.height*(.1+Math.random()*.4)}px`;
    l.style.setProperty('--dx',(160+Math.random()*Math.max(260,innerWidth*.5))+'px');
    l.style.setProperty('--dy',(100+Math.random()*Math.max(200,innerHeight*.4))+'px');
    l.style.setProperty('--rot',(240+Math.random()*420)+'deg');
    l.style.setProperty('--dur',(9+Math.random()*6)+'s');
    l.addEventListener('animationend',()=>l.remove());
    hl.appendChild(l);
  }
  let id;
  if(!reduce){drop();id=setInterval(drop,1300);}
  $('start').onclick=()=>{clearInterval(id);home.classList.add('out');setTimeout(()=>home.remove(),1000);};
})();

$("loginForm").addEventListener("submit",e=>{
  e.preventDefault();
  const m=$("lMsg");m.classList.remove("show");
  if(!$("lEmail").value.trim()||!$("lPass").value){return msg(m,"Rellena el correo electrónico y la contraseña.")}
  if(!$("lEmail").checkValidity()){return msg(m,"Introduce un correo electrónico válido.")}
  msg(m,"¡Bienvenido/a! Has iniciado sesión (demostración).");
});

$("signupForm").addEventListener("submit",e=>{
  e.preventDefault();
  const m=$("sMsg");m.classList.remove("show");
  const req=["sName","sSurname","sBirth","sEmail","sPass","sPass2"];
  if(req.some(id=>!$(id).value.trim())){return msg(m,"Rellena todos los campos obligatorios (*).")}
  if(!$("sEmail").checkValidity()){return msg(m,"Introduce un correo electrónico válido.")}
  if($("sPass").value.length<6){return msg(m,"La contraseña debe tener al menos 6 caracteres.")}
  if($("sPass").value!==$("sPass2").value){return msg(m,"Las contraseñas no coinciden.")}
  msg(m,"¡Usuario creado! Gracias por plantar tu árbol 🌱 (demostración).");
  e.target.reset();
});
</script>
</body>
</html>
